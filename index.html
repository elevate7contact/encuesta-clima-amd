<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu Experiencia en AMD · Diagnóstico de clima y cultura</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#f3f6fa; --card:#ffffff; --line:#dde5ee;
  --brand:#083765; --title:#083765; --text:#737373; --accent:#FF8800;
  --soft:#e7eef6; --pas:#8aa6c3; --det:#FF8800; --on-brand:#ffffff;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1726; --surface:#0f2237; --card:#11283f; --line:#223b55;
    --brand:#2f6aa8; --title:#aacdf0; --text:#aab4c0; --soft:#183452;
    --pas:#5f7f9f; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1726; --surface:#0f2237; --card:#11283f; --line:#223b55;
  --brand:#2f6aa8; --title:#aacdf0; --text:#aab4c0; --soft:#183452;
  --pas:#5f7f9f; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-weight:400;font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased}
b,strong{font-weight:700}
button,textarea{font-family:inherit;font-size:inherit}
h1,h2,h3,h4{font-weight:400;margin:0;color:var(--title);line-height:1.2}
h1{font-size:clamp(28px,5.2vw,40px)}
h2{font-size:clamp(24px,4vw,32px)}
h3{font-size:22px}
p{margin:0 0 14px}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hero{background:#083765;display:flex;align-items:center;justify-content:center;min-height:min(34vh,260px);padding:36px 20px}
.hero img{width:min(68%,460px);min-width:230px;height:auto;display:block}
.topbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.tab{border:1.5px solid var(--line);background:var(--card);color:var(--title);padding:9px 20px;border-radius:999px;cursor:pointer;font-size:16px}
.tab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.wrap{max-width:780px;margin:0 auto;padding:36px 20px 64px}
.wrap.wide{max-width:1060px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--title);background:var(--soft);padding:6px 14px;border-radius:999px;margin-bottom:18px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:block}
.lead{font-size:20px;margin:18px 0 26px}
.note{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line)}
.note .ic{font-size:30px;color:var(--accent);margin-top:2px}
.note p{margin:0}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--brand);color:var(--on-brand);border:0;border-radius:12px;padding:14px 28px;cursor:pointer;font-size:18px}
.btn:hover{filter:brightness(1.12)}
.btn:focus-visible,.tab:focus-visible,.lk button:focus-visible,.zs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--title);border:1.5px solid var(--line)}
.row{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:30px;flex-wrap:wrap}
.banner{background:var(--soft);border-left:4px solid var(--accent);padding:14px 18px;border-radius:8px;margin:0 0 22px;font-size:17px}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:10px}
.prog span{display:block;height:100%;background:var(--accent);transition:width .3s}
.stepinfo{font-size:15px;margin-bottom:26px}
.dimhead{display:flex;gap:18px;align-items:center;margin-bottom:6px}
.dimhead .ic{font-size:44px;color:var(--accent)}
.dimnum{font-size:15px;color:var(--text)}
.comp{margin:8px 0 28px}
.q{padding:24px 0;border-top:1px solid var(--line)}
.q p.qt{font-size:20px;color:var(--title);margin-bottom:16px}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lk button{border:1.5px solid var(--line);background:var(--card);color:var(--title);border-radius:12px;padding:14px 0;cursor:pointer;font-size:20px}
.lk button:hover{border-color:var(--accent)}
.lk button.sel{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.lkcap{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-top:8px}
.lkcap span:last-child{text-align:right}
textarea{width:100%;min-height:110px;resize:vertical;border:1.5px solid var(--line);background:var(--card);color:var(--title);border-radius:12px;padding:14px;line-height:1.5}
textarea:focus{outline:3px solid var(--accent);outline-offset:1px}
.zs{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
.zs button{border:1.5px solid var(--line);background:var(--card);color:var(--title);border-radius:10px;padding:10px 0;cursor:pointer;font-size:17px}
.zs button.sel{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.foot{text-align:center;padding:6px 20px 40px}
.lnk{background:none;border:0;color:var(--text);font-size:14px;cursor:pointer;text-decoration:underline;opacity:.7}
.lnk:hover{opacity:1}
.field{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--title);border-radius:12px;padding:14px;margin:0 0 12px;font-size:18px}
.field:focus{outline:3px solid var(--accent);outline-offset:1px}
.scale{margin-top:26px;padding:22px 24px;background:var(--surface);border-radius:16px}
.scale h3{margin-bottom:14px}
.scale li small{display:block;font-size:14px;line-height:1.3}
.scale ul{list-style:none;margin:0;padding:0}
.scale li{display:flex;align-items:center;gap:14px;padding:6px 0;font-size:18px;color:var(--text)}
.scale li span{flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.thanks{text-align:center;padding:30px 0}
.thanks .ic{font-size:64px;color:var(--accent);margin-bottom:14px}
/* resultados */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--title);padding:9px 20px;cursor:pointer;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:30px}
.kpi{background:var(--surface);border-radius:16px;padding:20px 22px}
.kpi .lb{font-size:15px}
.kpi .v{font-size:44px;color:var(--title);line-height:1.15;margin-top:6px}
.kpi .sub{font-size:15px}
.formula{border:1.5px dashed var(--line);border-radius:16px;padding:18px 22px;margin-bottom:34px;font-size:17px}
.formula .eq{font-size:20px;color:var(--title);margin:8px 0}
.dist{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);min-width:120px}
.dist i{display:block;height:100%}
.dist .p{background:var(--brand)} .dist .a{background:var(--pas)} .dist .d{background:var(--det)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin:6px 0 20px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.card>summary,.card>.ch{display:grid;grid-template-columns:auto 1fr minmax(120px,220px) auto;gap:16px;align-items:center;padding:18px 22px;cursor:pointer;list-style:none}
.card>summary::-webkit-details-marker{display:none}
.card .ic{font-size:30px;color:var(--accent)}
.card .nm{color:var(--title);font-size:19px;line-height:1.3}
.score{font-size:30px;color:var(--title);min-width:78px;text-align:right}
.score small{display:block;font-size:13px;color:var(--text)}
.cmp{display:flex;gap:18px;align-items:center;justify-content:flex-end}
.cmp .sc{text-align:right}
.dl{font-size:20px}
.dl.up{color:var(--title)} .dl.dn{color:var(--accent)}
.qrow{display:grid;grid-template-columns:1fr minmax(110px,200px) auto;gap:16px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);font-size:16px}
.qrow.qc{grid-template-columns:1fr auto}
.qrow .t{color:var(--title)}
.qrow .mide{display:block;font-size:14px;color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:34px 0}
.panel{background:var(--surface);border-radius:16px;padding:22px}
.panel h3{margin-bottom:12px;display:flex;align-items:center;gap:10px}
.panel h3 .ic{color:var(--accent);font-size:26px}
.panel ol{margin:0;padding-left:22px}
.panel li{margin-bottom:10px;font-size:16px;color:var(--title)}
.panel li span{color:var(--text);display:block;font-size:14px}
.sect{margin:42px 0 16px}
.ai{background:var(--surface);border-radius:16px;padding:22px;margin-top:10px;white-space:pre-wrap;font-size:17px}
.open{border-top:1px solid var(--line);padding:16px 0}
.open blockquote{margin:0 0 10px;padding:12px 16px;background:var(--surface);border-left:3px solid var(--accent);border-radius:6px;font-size:16px;color:var(--title)}
.pill{display:inline-block;background:var(--soft);color:var(--title);border-radius:999px;padding:3px 12px;margin:0 6px 6px 0;font-size:15px}
.empty{text-align:center;padding:50px 20px;border:1.5px dashed var(--line);border-radius:16px}
.scroll{overflow-x:auto}
@media (max-width:680px){
  body{font-size:18px}
  .card>summary,.card>.ch{grid-template-columns:auto 1fr auto}
  .card>summary .dist,.card>.ch .dist{grid-column:1/-1;order:5}
  .qrow{grid-template-columns:1fr auto}
  .qrow.qc{grid-template-columns:1fr}
  .qrow .dist{grid-column:1/-1}
  .card>summary .cmp{grid-column:1/-1;justify-content:space-between}
  .qrow.qc .cmp{justify-content:space-between}
  .two{grid-template-columns:1fr}
  .zs{grid-template-columns:repeat(6,1fr)}
  .lkcap{font-size:13px}
}
@media (prefers-reduced-motion:reduce){.prog span{transition:none}}

.settings{background:var(--surface);border-radius:16px;padding:18px 22px;margin:0 0 28px;display:grid;gap:12px}
.settings .line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.settings .line .field{margin:0;max-width:260px;padding:10px 14px;font-size:17px}
.btn.small{padding:10px 18px;font-size:16px}
label.lb{display:block;font-size:15px;margin:0 0 6px}
.lk{align-items:start}
.lc{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.lc button{width:100%}
.ll{font-size:13px;line-height:1.25;text-align:center;color:var(--text);hyphens:manual;overflow-wrap:break-word}
.lc.sel .ll{color:var(--title);font-weight:700}
@media (max-width:480px){.lk{gap:6px}.ll{font-size:11.5px}}
</style>
</head>

function vals(round,ids){var o=[];S.rows.forEach(function(r){var x=r[round];if(!x||!x.a)return;ids.forEach(function(id){var v=x.a[id];if(typeof v==='number'&&v>=1&&v<=5)o.push(v)})});return o}
function st(v){var n=v.length;if(!n)return null;var p=0,a=0;v.forEach(function(x){if(x===5)p++;else if(x===4)a++});var d=n-p-a;
  return {n:n,p:p,a:a,d:d,pp:p/n*100,ap:a/n*100,dp:d/n*100,enps:Math.round(p/n*100-d/n*100)}}
function nResp(round){return S.rows.filter(function(r){return r[round]&&r[round].a}).length}
function fs(n){return n>0?'+'+n:(n<0?'\u2212'+Math.abs(n):'0')}
function fd(a,b){if(!a||!b)return null;return b.enps-a.enps}
function dl(x){if(x==null)return '<span class="dl">\u2013</span>';return '<span class="dl '+(x>=0?'up':'dn')+'">'+fs(x)+'</span>'}
function distBar(s){if(!s)return '<div class="dist"></div>';return '<div class="dist" title="Promotores '+Math.round(s.pp)+'% · Pasivos '+Math.round(s.ap)+'% · Detractores '+Math.round(s.dp)+'%"><i class="p" style="width:'+s.pp+'%"></i><i class="a" style="width:'+s.ap+'%"></i><i class="d" style="width:'+s.dp+'%"></i></div>'}

function qstat(round,q){return st(vals(round,[q.id]))}
function dstat(round,d){return st(vals(round,d.qs.filter(function(q){return q.s}).map(function(q){return q.id})))}
function gstat(round){return st(vals(round,STARQ.map(function(q){return q.id})))}

  var active='<div class="seg" role="group" aria-label="Medición abierta al equipo"><button data-a="active" data-r="inicial" aria-pressed="'+(S.round==='inicial')+'">Abrir inicial</button><button data-a="active" data-r="cierre" aria-pressed="'+(S.round==='cierre')+'">Abrir cierre</button></div>';
  var head='<div class="rhead"><div><span class="chip"><i></i>Panel interno</span><h1>Resultados del <b>diagnóstico</b></h1></div>'+seg+'</div>'+
   '<div class="rhead" style="margin-top:-8px"><p style="margin:0">Medición abierta para el equipo ahora: <b>'+(S.round==='inicial'?'inicial':'cierre')+'</b></p>'+active+'</div>'+settings();
  if(!S.rowsReady)return hero()+topbar()+'<main class="wrap wide">'+head+'<div class="empty">Cargando respuestas…</div></main>';
  var gI=gstat('inicial'),gC=gstat('cierre'),sel=mode==='cierre'?gC:gI,nSel=mode==='cierre'?nc:ni;
  var k;
  if(mode==='compare')k='<div class="kpis"><div class="kpi"><div class="lb">Índice global · inicial</div><div class="v">'+(gI?fs(gI.enps):'\u2013')+'</div><div class="sub">'+ni+' respuestas</div></div><div class="kpi"><div class="lb">Índice global · cierre</div><div class="v">'+(gC?fs(gC.enps):'\u2013')+'</div><div class="sub">'+nc+' respuestas</div></div><div class="kpi"><div class="lb">Cambio del índice</div><div class="v">'+(gI&&gC?fs(gC.enps-gI.enps):'\u2013')+'</div><div class="sub">Cierre menos inicial</div></div></div>';
  else k='<div class="kpis"><div class="kpi"><div class="lb">Respuestas</div><div class="v">'+nSel+'</div><div class="sub">'+(nSel<5&&nSel>0?'Con menos de 5 respuestas la lectura es poco representativa':'Medición '+(mode==='cierre'?'de cierre':'inicial'))+'</div></div><div class="kpi"><div class="lb">Índice eNPS global</div><div class="v">'+(sel?fs(sel.enps):'\u2013')+'</div><div class="sub">Entre −100 y +100</div></div><div class="kpi"><div class="lb">Promotores · Pasivos · Detractores</div><div class="v" style="font-size:30px">'+(sel?Math.round(sel.pp)+'% · '+Math.round(sel.ap)+'% · '+Math.round(sel.dp)+'%':'\u2013')+'</div><div class="sub">Sobre las 15 preguntas del índice</div></div></div>';
  var formula='<div class="formula"><b>Cómo se calcula.</b> Cada respuesta se clasifica así: <b>Promotores</b> = 5 (Siempre), <b>Pasivos</b> = 4 (Casi siempre) y <b>Detractores</b> = 1, 2 y 3 (Nunca, Casi nunca y A veces; el punto neutro cuenta como detracción).<div class="eq">% Promotores = (Respuestas 5 ÷ Total respuestas) × 100</div><div class="eq">% Detractores = ((Respuestas 1 + 2 + 3) ÷ Total respuestas) × 100</div><div class="eq">eNPS = % Promotores − % Detractores</div>El resultado es un número entero entre −100 y +100. El índice usa solo las 15 preguntas marcadas para repetirse en el cierre de la semana 10; las preguntas abiertas no se miden.</div>';
  var legend='<div class="legend"><span><i style="background:var(--brand)"></i>Promotores (5)</span><span><i style="background:var(--pas)"></i>Pasivos (4)</span><span><i style="background:var(--det)"></i>Detractores (1–3)</span></div>';
  var hasAny=ni+nc>0;
  var body='';
  if(!hasAny)body='<div class="empty"><p><b>Aún no hay respuestas.</b></p><p>Cuando el equipo empiece a responder, los resultados aparecerán aquí al instante.</p></div>';
  else{
    body=(mode==='compare'?'':legend)+'<h2 class="sect">Las siete <b>dimensiones</b></h2>'+DIMS.map(function(d){return dimCard(d,mode)}).join('');
    var r=rank(mode);
    if(r.length){var top=r.slice(0,3),bot=r.slice(-3).reverse();
      body+='<div class="two">'+rankPanel(mode==='compare'?'Mayor mejora':'Fortalezas','up',top,mode)+rankPanel(mode==='compare'?'Mayor retroceso':'Alertas','alert',bot,mode)+'</div>'}
    if(mode!=='compare'&&mode!=='cierre'&&ni){
      var comp=ALLQ.filter(function(q){return !q.s});
      body+='<h2 class="sect">Preguntas <b>complementarias</b></h2><p>Solo se aplican en la medición inicial y no forman parte del índice.</p><div class="card">'+comp.map(function(q){var s=qstat('inicial',q);return '<div class="qrow"><div class="t">'+esc(q.t)+'<span class="mide">Mide: '+esc(q.m)+'</span></div>'+distBar(s)+sc(s)+'</div>'}).join('')+'</div>'}
    body+='<h2 class="sect">Lectura con <b>Claude</b></h2><p>Pídele un resumen con aspectos positivos, alertas y recomendaciones basado en estos resultados.</p><button class="btn" data-a="ai"'+(S.aiBusy?' disabled':'')+'>'+(S.aiBusy?'Analizando…':'Generar lectura')+'</button>'+(S.aiErr?'<div class="banner" style="margin-top:14px">'+esc(S.aiErr)+'</div>':'')+(S.ai?'<div class="ai">'+esc(S.ai)+'</div>':'')+
      '<h2 class="sect">Respuestas <b>abiertas</b></h2><p>Anónimas y sin medición. Corresponden a la medición inicial.</p>'+openBlock()+
      '<div class="row" style="margin-top:36px"><span></span><button class="btn ghost" data-a="csv">Descargar respuestas (CSV)</button></div>'}
  return hero()+topbar()+'<main class="wrap wide">'+head+k+formula+body+'</main>'}

function render(){
  var html;
  if((S.view==='results'||S.view==='gate')&&S.admin)html=(S.unlocked&&S.view==='results')?results():gate();
  else if(S.done)html=thanks();
  else if(S.step<0)html=welcome();
  else html=surveyStep();
  app.innerHTML=html+((S.admin&&!S.unlocked&&S.view!=='gate')?'<div class="foot"><button class="lnk" data-a="gate">Acceso interno</button></div>':'')}

/* acciones */
function setHash(v){try{if(v==='results')location.hash='resultados';else if(history.replaceState)history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
function paintAnswer(qid,v){var w=app.querySelector('[data-qwrap="'+qid+'"]');if(w)w.querySelectorAll('.lk button').forEach(function(b){var on=+b.getAttribute('data-v')===v;b.classList.toggle('sel',on);b.setAttribute('aria-pressed',on);if(b.parentNode)b.parentNode.classList.toggle('sel',on)});
  var sp=steps()[S.step],nb=document.getElementById('nextbtn');if(nb){var ok=stepComplete(sp);nb.disabled=(nb.getAttribute('data-a')==='next')?!ok:(S.busy||!S.ready||!ok)}}
app.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t)return;var a=t.getAttribute('data-a');
  if(a==='view'){S.view=t.getAttribute('data-v');setHash(S.view);render();window.scrollTo(0,0)}
  else if(a==='start'){S.step=0;S.msg='';render();window.scrollTo(0,0)}
  else if(a==='next'){S.step++;S.msg='';render();window.scrollTo(0,0)}
  else if(a==='back'){S.step--;S.msg='';render();window.scrollTo(0,0)}
  else if(a==='ans'){var q=t.getAttribute('data-q'),v=+t.getAttribute('data-v');S.ans[q]=v;paintAnswer(q,v)}
  else if(a==='oz'){var v2=+t.getAttribute('data-v');S.open.o3=v2;app.querySelectorAll('.zs button').forEach(function(b){var on=+b.getAttribute('data-v')===v2;b.classList.toggle('sel',on);b.setAttribute('aria-pressed',on)})}
  else if(a==='send')send();
  else if(a==='mode'){S.mode=t.getAttribute('data-m');S.ai='';render()}
  else if(a==='active')setActive(t.getAttribute('data-r'));
  else if(a==='ai')askAI();
  else if(a==='csv')exportCsv();
  else if(a==='gate'){S.view=S.unlocked?'results':'gate';S.gateMsg='';render();window.scrollTo(0,0)}
  else if(a==='leave'){S.view='survey';S.changing=false;S.gateMsg='';setHash('survey');render()}
  else if(a==='unlock')doUnlock();
  else if(a==='chpin'){S.changing=true;S.gateMsg='';S.view='gate';render();window.scrollTo(0,0)}
  else if(a==='lock'){lockPanel();S.view='survey';setHash('survey');render();window.scrollTo(0,0)}
  else if(a==='savecode')saveCode();
  else if(a==='clearcode'){S.codeInput='';saveCode()}
});
app.addEventListener('input',function(e){var t=e.target,a=t.getAttribute&&t.getAttribute('data-a');
  if(a==='ot')S.open[t.getAttribute('data-o')]=t.value;
  else if(a==='code'){S.code=t.value;var b=document.getElementById('startbtn');if(b)b.disabled=!!(S.already||!S.ready||(S.codeRequired&&!S.code.trim()))}
  else if(a==='codeinput')S.codeInput=t.value});
app.addEventListener('toggle',function(e){var d=e.target;if(d&&d.tagName==='DETAILS'&&d.getAttribute('data-d'))S.openDims[d.getAttribute('data-d')]=d.open},true);

var CFG=window.AMD_CONFIG||{};
function rpc(name,args){
  if(!CFG.SUPABASE_URL||/TU-PROYECTO/.test(CFG.SUPABASE_URL)||!CFG.SUPABASE_ANON_KEY||/TU-ANON/.test(CFG.SUPABASE_ANON_KEY))return Promise.reject(new Error('sin_config'));
  var h={'Content-Type':'application/json','apikey':CFG.SUPABASE_ANON_KEY||''};
  if(/^eyJ/.test(CFG.SUPABASE_ANON_KEY||''))h['Authorization']='Bearer '+CFG.SUPABASE_ANON_KEY;
  return fetch((CFG.SUPABASE_URL||'').replace(/\/+$/,'')+'/rest/v1/rpc/'+name,{method:'POST',headers:h,body:JSON.stringify(args||{})}).catch(function(){throw new Error('sin_red')}).then(function(r){
    return r.text().then(function(t){var j=null;try{j=JSON.parse(t)}catch(e){}if(!r.ok)throw new Error((j&&j.message)||('http_'+r.status));return j})})}
function send(){
  if(!S.ready||S.busy)return;S.busy=true;S.msg='';render();
  var round=S.round,ids=steps().filter(function(s){return s.t==='dim'}).reduce(function(a,s){return a.concat(s.qs.map(function(q){return q.id}))},[]);
  var a={};ids.forEach(function(id){a[id]=S.ans[id]});
  var o=null;if(round==='inicial'){o={};OPEN.forEach(function(x){var v=S.open[x.id];if(v!==undefined&&v!==''&&v!==null)o[x.id]=v})}
  rpc('submit_response',{p_round:round,p_answers:a,p_open:o,p_code:S.code.trim()||null}).then(function(){
    try{localStorage.setItem('amd-clima-'+round,'1')}catch(e){}
    S.busy=false;S.done=true;S.already=true;render();window.scrollTo(0,0)}).catch(function(err){
    S.busy=false;var m=(err&&err.message)||'';
    S.msg=m.indexOf('ronda_cerrada')>=0?'Esta medición ya no está abierta. Recarga la página.':(m.indexOf('respuestas_incompletas')>=0?'Faltan preguntas por contestar. Revisa los pasos anteriores.':m.indexOf('codigo_invalido')>=0?(S.codeBad=true,'El código de acceso no es correcto. Corrígelo aquí abajo y vuelve a enviar.'):'No pudimos guardar tu respuesta. Revisa tu conexión e inténtalo de nuevo.');render()})}

/* ---- panel privado: la clave se verifica en el servidor ---- */
function adminCall(name,extra){var args=Object.assign({p_pin:S.pinValue},extra||{});
  return rpc(name,args).then(function(r){if(r&&r.ok===false){var e=new Error(r.error);e.code=r.error;throw e}return r})}
function msgFor(e){var c=e&&e.code;
  if(c==='clave_incorrecta')return 'Clave incorrecta.';
  if(c==='bloqueado')return 'Demasiados intentos. Espera unos minutos e inténtalo otra vez.';
  if(c==='clave_no_configurada')return 'Aún no hay una clave de administrador. Créala en Supabase (ver README).';
  var m=(e&&e.message)||'';
  if(m==='sin_config')return 'Falta configurar config.js con la URL y la clave pública de tu proyecto de Supabase.';
  if(m==='sin_red')return 'No pudimos conectar con Supabase. Revisa tu conexión y que la URL de config.js sea la de tu proyecto.';
  if(/^http_(401|403)$/.test(m)||/apikey|JWT/i.test(m))return 'Supabase rechazó la clave pública de config.js. Revisa que sea la correcta.';
  return 'No pudimos conectar ('+m+'). Inténtalo de nuevo.'}
function applyDash(d){
  S.rows=(d.rows||[]).map(function(x){var o={};o[x.r]={ts:x.ts,a:x.a,o:x.o||{}};return o});
  S.rowsReady=true;S.round=d.round==='cierre'?'cierre':'inicial';S.codeCur=d.code||'';
  if(!S.codeTouched){S.codeInput=S.codeCur;S.codeTouched=true}}
function lockPanel(){S.unlocked=false;S.changing=false;S.ai='';S.pinValue='';S.rows=[];S.rowsReady=false;S.sig='';S.codeTouched=false;if(S.poll){clearInterval(S.poll);S.poll=null}}
function opened(d){S.unlocked=true;S.changing=false;S.gateMsg='';S.view='results';setHash('results');applyDash(d);S.sig=JSON.stringify(d);
  if(S.poll)clearInterval(S.poll);S.poll=setInterval(refreshAdmin,15000);render();window.scrollTo(0,0)}
function refreshAdmin(){
  if(!S.unlocked||S.view!=='results'||document.hidden)return;
  adminCall('admin_get_dashboard').then(function(d){var sig=JSON.stringify(d);if(sig!==S.sig){S.sig=sig;applyDash(d);render()}})
   .catch(function(e){if(e&&(e.code==='clave_incorrecta'||e.code==='bloqueado')){lockPanel();S.view='gate';S.gateMsg=msgFor(e);render()}})}
function doUnlock(){
  var e1=document.getElementById('pin1'),e2=document.getElementById('pin2'),p1=e1?e1.value:'',p2=e2?e2.value:null;
  if(S.changing){
    if(p1.length<8){S.gateMsg='La clave debe tener al menos 8 caracteres.';render();return}
    if(p1!==p2){S.gateMsg='Las dos claves no coinciden.';render();return}
    adminCall('admin_change_pin',{p_new:p1}).then(function(){S.pinValue=p1;S.changing=false;S.gateMsg='';S.view='results';render();window.scrollTo(0,0)})
     .catch(function(e){S.gateMsg=e&&e.code==='clave_corta'?'La clave debe tener al menos 8 caracteres.':'No pudimos cambiar la clave. Inténtalo de nuevo.';render()});return}
  if(!p1){S.gateMsg='Escribe la clave.';render();return}
  S.pinValue=p1;S.busy=true;render();
  adminCall('admin_get_dashboard').then(function(d){S.busy=false;opened(d)}).catch(function(e){S.busy=false;S.pinValue='';S.gateMsg=msgFor(e);render()})}
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('data-enter'))doUnlock()});
function setActive(r){if(!S.unlocked||r===S.round)return;
  adminCall('admin_set_round',{p_round:r}).then(function(){S.round=r;S.ans={};S.sig='';render()}).catch(function(e){S.info=msgFor(e);render()})}
function saveCode(){var v=S.codeInput.trim();
  adminCall('admin_set_code',{p_code:v}).then(function(){S.codeCur=v;S.info=v?'Código guardado.':'Código quitado: ya no se pide.';S.sig='';render()}).catch(function(e){S.info=msgFor(e);render()})}

function csvCell(v){v=v==null?'':String(v);return '"'+v.replace(/"/g,'""').replace(/\r?\n/g,' ')+'"'}
function exportCsv(){
  var head=['Medición','Fecha'].concat(ALLQ.map(function(q){return q.t})).concat(OPEN.map(function(o){return o.t}));var lines=[head.map(csvCell).join(',')];
  S.rows.forEach(function(r){['inicial','cierre'].forEach(function(k){var x=r[k];if(!x||!x.a)return;
    var row=[k,new Date(x.ts||0).toISOString().slice(0,10)];ALLQ.forEach(function(q){row.push(x.a[q.id]==null?'':x.a[q.id])});OPEN.forEach(function(o){row.push(x.o&&x.o[o.id]!=null?x.o[o.id]:'')});lines.push(row.map(csvCell).join(','))})});
  var blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});var u=URL.createObjectURL(blob);var a=document.createElement('a');a.href=u;a.download='diagnostico-clima-amd.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},1000)}
function askAI(){
  var mode=S.mode;var pack={medicion:mode,respuestas:{inicial:nResp('inicial'),cierre:nResp('cierre')},indice_global:{inicial:gstat('inicial'),cierre:gstat('cierre')},
  dimensiones:DIMS.map(function(d){return {dimension:d.n,inicial:dstat('inicial',d),cierre:dstat('cierre',d)}}),
  preguntas:STARQ.map(function(q){return {pregunta:q.t,inicial:qstat('inicial',q),cierre:qstat('cierre',q)}})};
  var ab=[];S.rows.forEach(function(r){var x=r.inicial;if(x&&x.o){if(x.o.o1)ab.push('Valora: '+String(x.o.o1).slice(0,300));if(x.o.o2)ab.push('Cambiaría: '+String(x.o.o2).slice(0,300))}});
  var prompt='Eres analista de clima organizacional de AMD Agencia Marketing Digital. Con base SOLO en los datos de abajo, escribe en español, con tono cercano y directo: 1) Aspectos positivos, 2) Alertas, 3) Recomendaciones (máximo 5, accionables). Reglas del cálculo: promotores = respuesta 5, pasivos = 4, detractores = 1 a 3; eNPS = % promotores − % detractores, entero entre −100 y +100. Si hay datos de inicial y de cierre, comenta el cambio. No inventes cifras ni causas que los datos no muestren. Máximo 250 palabras, sin tablas.\n\nDATOS (JSON):\n'+JSON.stringify(pack)+'\n\nRESPUESTAS ABIERTAS (anónimas):\n'+ab.slice(0,60).join('\n');
  S.aiBusy=true;S.aiErr='';render();
  fetch('/api/lectura',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:S.pinValue,prompt:prompt})})
   .then(function(r){return r.json().catch(function(){return {error:'respuesta inesperada del servidor (HTTP '+r.status+')'}}).then(function(j){if(!r.ok)throw new Error((j&&j.error)||('HTTP '+r.status));return j})})
   .then(function(j){S.ai=j.text||'';S.aiBusy=false;render()})
   .catch(function(e){S.aiBusy=false;S.aiErr=(e&&e.message&&e.message.indexOf('clave')>=0)?'La clave ya no es válida. Vuelve a entrar al panel.':'No pudimos generar la lectura: '+((e&&e.message)||'error desconocido')+'.';render()})}

/* arranque */
if(location.hash==='#resultados')S.view='results';
render();
rpc('get_public_config').then(function(c){
  S.round=c.round==='cierre'?'cierre':'inicial';S.codeRequired=!!c.code_required;S.ready=true;
  try{S.already=localStorage.getItem('amd-clima-'+S.round)!==null}catch(e){}
  render()}).catch(function(e){S.cfgErr=true;S.cfgMsg=msgFor(e);render()});
})();
</script>
